[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/propellants",
    "crates/sizing-l0",
    "crates/thermo",
    "crates/gasdynamics",
    "crates/cooling",
    "crates/injector",
    "crates/feedsystem",
    "crates/structures",
    "crates/turbopumps",
    "crates/simulate",
    "crates/export",
    "tools/apro-engine-cli",
    "tools/apro-engine-server",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
thiserror = "2"
log = "0.4"

